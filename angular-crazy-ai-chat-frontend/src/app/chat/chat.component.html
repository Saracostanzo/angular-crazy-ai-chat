<div class="chat-container">
  <div class="messages" #messagesContainer>
    <div *ngFor="let msg of messages"
         [ngClass]="{
           'user-msg': msg.sender==='user',
           'bot-msg': msg.sender==='bot'
         }">
      <span class="emoji">{{ msg.sender==='user' ? '😎' : '🤖' }}</span>
      {{ msg.text }}
    </div>
    <div *ngIf="loading" class="bot-msg loading">
      🤖 Sta pensando...
    </div>
  </div>

  <div class="input-area">
    <input type="text" [(ngModel)]="userInput" placeholder="Scrivi qualcosa di pazzo..." (keyup.enter)="send()" />
    <button (click)="send()">⚡ Send!</button>
  </div>
</div>
